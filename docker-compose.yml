version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: aiip_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiip_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aiip_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiip_user -d aiip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiip_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiip_user}:${POSTGRES_PASSWORD:-aiip_secure_pass}@db:5432/${POSTGRES_DB:-aiip_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-min-32-chars}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY:-change-refresh-secret-min-32-chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiip_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
